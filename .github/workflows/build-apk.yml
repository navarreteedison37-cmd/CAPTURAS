name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al gradlew (si existe)
        run: chmod +x ./gradlew || echo "No hay gradlew, se usara gradle directo"

      - name: Compilar el APK (version debug, firmada automaticamente)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Mostrar todos los APK generados
        run: find . -name "*.apk" -exec ls -lh {} \;

      - name: Verificar que el APK este firmado
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no se genero ningun APK"
            exit 1
          fi
          echo "Revisando: $APK"
          unzip -l "$APK" | grep -qiE "\.RSA|\.DSA|\.EC$" || { echo "ERROR: el APK no esta firmado"; exit 1; }
          echo "TODO CORRECTO: el APK esta firmado."

      - name: Publicar el APK como descarga
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
