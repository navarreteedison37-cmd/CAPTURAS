name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Audit source files
        run: |
          test -f app/src/main/java/com/capturadatos/ocr/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/file_paths.xml
          grep -q 'com.google.mlkit:text-recognition' app/build.gradle.kts
          grep -q 'NO DETECTADO' app/src/main/java/com/capturadatos/ocr/MainActivity.kt
          grep -q '11' /dev/null || true

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapturaDatosOCR-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
