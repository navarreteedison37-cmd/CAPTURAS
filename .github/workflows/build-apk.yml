name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Audit source files
        run: |
          set -e
          test -f app/src/main/java/com/capturadatos/ocr/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/file_paths.xml
          grep -q 'com.google.mlkit:text-recognition' app/build.gradle.kts
          grep -q 'NO DETECTADO' app/src/main/java/com/capturadatos/ocr/MainActivity.kt

      - name: Clean previous outputs
        run: gradle --no-daemon clean

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK is signed, aligned and valid
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$SDK_BUILD_TOOLS/zipalign" -c -P 4 -v 4 "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK VALIDADO: $APK"

      - name: Upload verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CapturaDatosOCR-INSTALABLE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
